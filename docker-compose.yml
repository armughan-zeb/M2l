services:
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vidzeo-muse-worker:2.0.0
    container_name: vidzeo-muse-worker
    env_file:
      - .env
    environment:
      MUSE_INFERENCE_COMPULSORY: "1"
      MUSE_AUTO_LOOP: "1"
      MUSE_INFERENCE_COMMAND: "node /app/scripts/muse-inference-spool.cjs"
      MUSE_REPO_ROOT: "/app"
      VIDZEO_SKIP_THUMBNAILS: "1"
      NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/ca-certificates.crt"
      SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
      VIDZEO_RUNTIME_ROOT: "/data/runtime"
      VIDZEO_TEMP_DIR: "/data/runtime/temp"
      TMPDIR: "/data/runtime/temp"
      MUSE_WORK_DIR: "/data/work"
      MUSE_CONFIG_FILE: "/data/.muse-agent.json"
      VIDZEO_BRIDGE_ROOT: "/data/runtime/temp/agent-bridge"
      MUSE_INBOX_HOOK_DEFINITION: "/host-hooks/vidnets-inbox-watch.json"
      MUSE_INBOX_HOOK_STATE_DIR: "/host-hook-state"
      REMOTION_BROWSER_EXECUTABLE: "/opt/chrome-headless-shell-linux64/chrome-headless-shell"
    volumes:
      - ./data:/data
      - ${HOST_HOOKS_DIR:-${HOME}/hooks/definitions}:/host-hooks:ro
      - ${HOST_HOOK_STATE_DIR:-${HOME}/hooks/state/vidnets-inbox-watch}:/host-hook-state:ro
    restart: unless-stopped
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "node", "/app/muse-agent.js", "status"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
