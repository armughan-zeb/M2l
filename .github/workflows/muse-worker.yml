name: Muse worker

on:
  push:
    branches: [main, fix/media-round14]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            one_minute_documentary/templates/remotion-project/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          npm ci --no-audit --no-fund
          npm --prefix one_minute_documentary/templates/remotion-project install --no-audit --no-fund
      - name: Verify worker, skills, and shell scripts
        run: |
          for script in setup.sh setup-linux.sh start.sh start-daemon.sh scripts/install-inbox-hook.sh docker/entrypoint.sh; do
            bash -n "$script"
          done
          bash tests/hook-stale-request.test.sh
          npm test
