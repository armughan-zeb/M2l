[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = server .
norecursedirs =
    .git
    .pytest_cache
    node_modules
    tools
    temp
    temp_test
    output
    dist
    dist-build-cache
    cache
    public
# /tmp always exists; temp/pytest broke the whole suite whenever temp/ was
# cleaned, because pytest creates basetemp without parents=True.
addopts = -ra --basetemp=/tmp/vidnets-pytest
