# Vidnets Studio — Niche-Specific Source Registry
# Each niche defines a waterfall of tiers. Tiers are tried in order;
# move to the next tier only if the current one returns < min_candidates
# with score >= min_score.

niches:
  # ── Sports / Cricket ─────────────────────────────────────────────
  cricket:
    keywords: [cricket, batsman, bowler, IPL, "test match", ODI, T20, kohli, dhoni, rohit, pandya, wicket, century, sixer, "world cup"]
    tier_0:
      - type: reddit
        subreddits: [Cricket, cricketshitposting, IndianCricketTeam]
        sort: top
        time: year
        limit: 20
      - type: wikimedia
        category: Cricket
        limit: 15
      - type: wikimedia_category
        limit: 30
      - type: sportsdb
        limit: 10
    tier_1:
      - type: openverse
        limit: 20
      - type: rss
        niche: sports
        limit: 10
      - type: bing
        editorial_boost: true
        limit: 20
      - type: ddg
        limit: 15
    tier_2:
      - type: youtube_thumb
        limit: 15
      - type: ytdlp_frames
        limit: 10
    tier_3:
      - type: unsplash
        limit: 15
