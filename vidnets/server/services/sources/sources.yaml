# ── Per-Niche Query Vocabulary (constrains query generation) ───────
niche_vocab:
  cricket:
    actions: [batting, bowling, fielding, celebrating, century, six, wicket, diving catch]
    settings: [stadium, pitch, crease, dressing room, pavilion]
    modifiers: [test, ODI, T20, IPL, "world cup", international]
    forbidden: [thinking, remembering, legacy, impact, strategy]

  football:
    actions: [scoring, celebrating, tackling, dribbling, saving, heading]
    settings: [stadium, pitch, locker room, tunnel]
    modifiers: ["premier league", champions, international, derby]
    forbidden: [thinking, legacy, impact]

  tech:
    actions: [unboxing, demo, presentation, launch, coding, testing]
    settings: ["keynote stage", lab, factory, office, server room]
    modifiers: [prototype, retail, concept, flagship]
    forbidden: [thinking, remembering, legacy]

  history:
    actions: [battle, portrait, ruins, artifact, ceremony, march]
    settings: [battlefield, palace, museum, ruins, archive]
    modifiers: [ancient, medieval, modern, archival, vintage]
    forbidden: [modern, digital, futuristic]

  nature:
    actions: [hunting, flying, swimming, blooming, landscape, sunset]
    settings: [forest, ocean, mountain, desert, savanna, reef]
    modifiers: [wild, aerial, macro, panoramic, closeup]
    forbidden: [artificial, synthetic, digital]

  business:
    actions: [meeting, presentation, handshake, working, analyzing]
    settings: [office, boardroom, trading floor, conference]
    modifiers: [corporate, professional, modern, team]
    forbidden: [casual, party, festival]

  science:
    actions: [experiment, observation, launch, discovery, research]
    settings: [laboratory, observatory, space, field site]
    modifiers: [microscopic, telescopic, molecular, orbital]
    forbidden: [fantasy, fictional, artistic]

  food:
    actions: [plating, cooking, pouring, slicing, garnishing]
    settings: [kitchen, restaurant, table, market]
    modifiers: [closeup, overhead, rustic, gourmet]
    forbidden: [abstract, conceptual, digital]

  travel:
    actions: [exploring, arriving, photographing, hiking, sightseeing]
    settings: [landmark, street, beach, mountain, cityscape]
    modifiers: [panoramic, aerial, golden hour, tourist]
    forbidden: [indoor, studio, artificial]

  gaming:
    actions: [playing, streaming, competing, celebrating, focused]
    settings: [arena, setup, stage, convention]
    modifiers: [esports, competitive, casual, retro]
    forbidden: [realistic, documentary, news]

  celebrity:
    actions: [portrait, red carpet, performing, interview, candid]
    settings: [stage, premiere, event, studio]
    modifiers: [closeup, professional, candid, iconic]
    forbidden: [anonymous, stock, generic]

  politics:
    actions: [speaking, campaigning, voting, protesting, signing]
    settings: [podium, parliament, rally, office, summit]
    modifiers: [official, formal, historic, breaking]
    forbidden: [casual, entertainment, fictional]

  default:
    actions: [portrait, action, detail, overview, closeup]
    settings: [indoor, outdoor, urban, natural]
    modifiers: [professional, high quality, modern]
    forbidden: []
